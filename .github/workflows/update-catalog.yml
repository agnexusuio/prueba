name: Actualización Automática de Catálogo

on:
  schedule:
    # 21:00 UTC = 16:00 Hora Continental Ecuador (UTC-5) cada lunes
    - cron: '0 21 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          pip install requests beautifulsoup4 playwright pillow
          playwright install --with-deps chromium

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Publicar Cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add productos.json imagenes/
          if git status --porcelain | grep -q 'productos.json\|imagenes/'; then
            git commit -m "Auto-update catálogo [$(date -u +'%Y-%m-%d %H:%M') UTC]"
            git push
          fi
